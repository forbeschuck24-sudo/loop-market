services:
  - type: web
    name: loop-market-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
      - key: HANDLING_FEE_CENTS
      - key: PROMOTED_LISTING_PRICE_CENTS
      - key: PROMOTED_LISTING_DAYS
      - key: PREMIUM_MONTHLY_CENTS
      - key: CLIENT_URL
